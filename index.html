<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@YourUsername</title>
    <style>
        body { 
            background-color: #0d0d0d; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            text-align: center; 
        }
        .container { 
            max-width: 400px; 
            width: 100%;
            padding: 20px; 
        }
        .pfp { 
            width: 110px; 
            height: 110px; 
            border-radius: 50%; 
            background: #222; 
            margin: 0 auto 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
            border: 2px solid #333;
        }
        .pfp img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        h1 { 
            margin: 0 0 10px; 
            font-size: 24px; 
            letter-spacing: 1px;
        }
        p { 
            color: #888; 
            margin: 0 0 30px; 
            font-size: 14px;
        }
        a { 
            display: block; 
            background: #1a1a1a; 
            color: #fff; 
            text-decoration: none; 
            padding: 15px; 
            margin-bottom: 12px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            transition: 0.3s; 
            font-weight: 500;
        }
        a:hover { 
            background: #333; 
            border-color: #555; 
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="pfp">
            <!-- Replace the src below with a link to your own image later -->
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=placeholder" alt="Profile Picture">
        </div>
        <h1>@YourUsername</h1>
        <p>Just a chill guy on the internet.</p>
        
        <a href="https://twitter.com/yourhandle" target="_blank">Twitter / X</a>
        <a href="https://discord.gg/yourinvite" target="_blank">Discord Server</a>
        <a href="https://github.com/yourhandle" target="_blank">GitHub</a>
    </div>
</body>
</html>
